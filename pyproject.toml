[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n6705c-seq"
version = "0.1.0"
description = "Multi-mainframe power-up sequencing for Keysight N6705C"
requires-python = ">=3.11"
dependencies = ["n6705c-app"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
n6705c-seq = "n6705c_seq.cli:main"

[project.gui-scripts]
n6705c-seq-gui = "n6705c_seq.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
