[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n6705c-seq"
version = "0.1.3"
description = "Multi-mainframe power-up sequencing for Keysight N6705C"
requires-python = ">=3.11"
dependencies = [
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",   # pure-Python backend; LAN always, USB (USBTMC) with pyusb below
    "pyusb>=1.2",       # USBTMC transport for pyvisa-py
    "libusb-package>=1.0",  # bundled libusb DLL so pyusb works without a system install
    "numpy>=1.26",
    "pywebview==6.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
build = ["pyinstaller>=6"]

[project.scripts]
n6705c-seq = "n6705c_seq.cli:main"

[project.gui-scripts]
n6705c-seq-gui = "n6705c_seq.webgui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
n6705c_seq = ["web/*", "analysis/web/viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
